name: website-preview-lighthouse

# The Lighthouse GATE on the shipped artifact (W05 carry-over, W06): when
# Vercel reports a successful Preview deployment of the website, run the
# three-run mobile Lighthouse check (website/scripts/lighthouse.mjs, the
# ledger thresholds) against that deployment URL, at the deployed commit.
#
# The preview is protected, so the run uses the project's "Protection Bypass
# for Automation" secret from the GitHub Actions secret
# VERCEL_AUTOMATION_BYPASS_SECRET. It is handed only to the Lighthouse step,
# only after the URL is checked to be one of this project's vercel.app
# deployments, and the script never writes it to a record.
#
# Vercel sends x-robots-tag: noindex on every preview, which fails Lighthouse's
# is-crawlable audit by design. LIGHTHOUSE_PREVIEW=1 lets the script drop that
# one audit from the SEO score, and only when every blocking directive it found
# is that response header; a noindex in the page itself still fails. Full SEO
# (>= 0.95, is-crawlable included) is gated on production.
#
# The local-server Lighthouse run in website-checks.yml stays informational.

on:
  deployment_status:

permissions:
  contents: read

concurrency:
  group: website-preview-lighthouse-${{ github.event.deployment.id }}
  cancel-in-progress: true

jobs:
  lighthouse:
    name: Lighthouse gate on the Vercel preview
    if: >-
      github.event.deployment_status.state == 'success' &&
      startsWith(github.event.deployment.environment, 'Preview') &&
      github.event.deployment_status.creator.login == 'vercel[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    env:
      DEPLOYMENT_URL: ${{ github.event.deployment_status.environment_url || github.event.deployment_status.target_url }}
      LIGHTHOUSE_OUT: ${{ github.workspace }}/lighthouse-preview
    steps:
      - name: Check the deployment URL and the bypass secret
        env:
          HAS_BYPASS: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET != '' }}
        run: |
          echo "deployment ${{ github.event.deployment.id }} at ${{ github.event.deployment.sha }}: $DEPLOYMENT_URL"
          host="$(node -e 'console.log(new URL(process.argv[1]).host)' "$DEPLOYMENT_URL")" || {
            echo "::error::no valid deployment URL in the deployment_status event"; exit 1; }
          [[ "$DEPLOYMENT_URL" == https://* && "$host" =~ ^m5-guardian-[a-z0-9-]+\.vercel\.app$ ]] || {
            echo "::error::refusing to send the bypass secret to $host (not an m5-guardian vercel.app deployment)"; exit 1; }
          [ "$HAS_BYPASS" = true ] || {
            echo "::error::GitHub Actions secret VERCEL_AUTOMATION_BYPASS_SECRET is not set"; exit 1; }

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.deployment.sha }}
          persist-credentials: false

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: website/package.json

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.x"
          cache: pnpm
          cache-dependency-path: website/pnpm-lock.yaml

      - name: Install (frozen lockfile)
        working-directory: website
        run: pnpm install --frozen-lockfile

      - name: Install the pinned Chromium
        working-directory: website
        run: pnpm exec playwright install --with-deps chromium

      - name: Mobile Lighthouse, three runs, on the preview (gate)
        working-directory: website
        env:
          LIGHTHOUSE_URL: ${{ env.DEPLOYMENT_URL }}
          LIGHTHOUSE_PREVIEW: "1"
          LIGHTHOUSE_BYPASS: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: node scripts/lighthouse.mjs

      - name: Keep the Lighthouse reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lighthouse-preview-${{ github.event.deployment.id }}
          path: lighthouse-preview/
          if-no-files-found: ignore
          retention-days: 14
